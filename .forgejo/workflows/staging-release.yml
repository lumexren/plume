name: Staging Release

on:
  push:
    branches:
      - staging
    paths-ignore:
      - '**.md'
      - '.forgejo/**'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version-file: .zigversion

      - name: Run Tests
        run: zig build test

      - name: Calculate Version and Publish Release
        env:
          EMAIL: ${{ secrets.EMAIL }}
        run: |
          set -euo pipefail

          BASE_VERSION=$(grep -oP '\.version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' build.zig.zon)
          if [ -z "$BASE_VERSION" ]; then
            echo "Error: Base version not found in build.zig.zon"
            exit 1
          fi

          LAST_STABLE_TAG=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' | grep -v '-' | sort -V | tail -n1 || true)

          if [ -n "$LAST_STABLE_TAG" ]; then
            COMMITS=$(git rev-list --count "${LAST_STABLE_TAG}"..HEAD)
          else
            COMMITS=$(git rev-list --count HEAD)
          fi

          VERSION="${BASE_VERSION}-staging.${COMMITS}"
          echo "Calculated staging version: ${VERSION}"

          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${VERSION} already exists, skipping."
            exit 0
          fi

          sed -i "s/\.version = \"[^\"]*\"/\.version = \"${VERSION}\"/" build.zig.zon

          git config user.name "erenvly"
          git config user.email "${EMAIL}"

          if ! git diff --quiet build.zig.zon; then
            git commit -am "chore(release): bump version to ${VERSION} [skip ci]"
          fi

          git tag -a "${VERSION}" -m "Release ${VERSION}"

          git push origin staging
          git push origin "${VERSION}"
