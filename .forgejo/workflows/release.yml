name: Release

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: [codeberg-medium]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig
        uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version-file: .zigversion

      - name: Run Tests
        run: zig build test

      - name: Set Version
        id: version
        run: |
          VERSION=$(grep -oP '\.version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' build.zig.zon)
          if [ -z "$VERSION" ]; then
            echo "Error: Version not found in build.zig.zon"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create and Push Git Tag
        env:
          EMAIL: ${{ secrets.EMAIL }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/\.version = \"[^\"]*\"/\.version = \"${VERSION}\"/" build.zig.zon

          git config user.name "erenvly"
          git config user.email "${EMAIL}"
          git remote set-url origin "https://x-access-token:${{ github.token }}@codeberg.org/${{ github.repository }}.git"

          if ! git diff --quiet build.zig.zon; then
            git commit -am "chore(release): release ${VERSION} [skip ci]"
            git push origin "${GITHUB_REF_NAME}"
          fi

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping."
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Generate Changelog
        run: |
          bash .forgejo/scripts/generate-changelog.sh \
            --mode stable \
            --version "${{ steps.version.outputs.version }}" \
            --output release_notes.md

      - name: Create Release
        uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          prerelease: false
